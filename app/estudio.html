<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Estudio PJN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..750&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed rail of sections on the left (top strip on phones), work area on the right, the expediente "ficha" slides over from the right. */
:root {
  --paper: #f3f5f3; --panel: #ffffff; --ink: #142220; --muted: #5a6966; --line: #d8dfdc; --line-strong: #b9c4c0;
  --accent: #1d5a52; --accent-ink: #ffffff; --accent-soft: #e2eeeb;
  --urgent: #b3261e; --urgent-soft: #fbe9e7; --warn: #9a5800; --warn-soft: #fbf0df; --ok: #2c6a3a; --ok-soft: #e5f2e7;
  --shadow: 0 1px 2px rgba(20,34,32,.06), 0 8px 24px rgba(20,34,32,.08);
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1514; --panel: #152120; --ink: #e5ecea; --muted: #92a29e; --line: #24322f; --line-strong: #364743;
  --accent: #62b3a7; --accent-ink: #08201c; --accent-soft: #1b302d;
  --urgent: #ff8f84; --urgent-soft: #3a1b19; --warn: #f0b45c; --warn-soft: #33270f; --ok: #82c991; --ok-soft: #17301d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0e1514; --panel: #152120; --ink: #e5ecea; --muted: #92a29e; --line: #24322f; --line-strong: #364743;
  --accent: #62b3a7; --accent-ink: #08201c; --accent-soft: #1b302d;
  --urgent: #ff8f84; --urgent-soft: #3a1b19; --warn: #f0b45c; --warn-soft: #33270f; --ok: #82c991; --ok-soft: #17301d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); border-right: 1px solid var(--line); padding: 20px 12px 16px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; background: var(--paper); }
.brand { display: grid; gap: 2px; padding: 0 8px; }
.brand b { font-weight: 720; font-stretch: 85%; font-size: 19px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--panel); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 650; }
.nav .badge { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 999px; background: var(--urgent-soft); color: var(--urgent); font-variant-numeric: tabular-nums; }
.nav .badge.soft { background: var(--accent-soft); color: var(--accent); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--muted); }
.datachip { display: flex; gap: 6px; align-items: flex-start; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: none; margin-top: 5px; }
.dot.live { background: var(--ok); } .dot.old { background: var(--warn); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; text-align: left; }

.main { min-width: 0; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px 28px; display: grid; gap: 20px; align-content: start; }
.topbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.topbar h1 { margin: 0; font-size: 26px; font-weight: 700; font-stretch: 88%; letter-spacing: -.015em; text-wrap: balance; }
.topbar .sub { color: var(--muted); font-size: 13px; }
.topbar .grow { flex: 1 1 auto; }
.search { position: relative; flex: 0 1 22rem; min-width: 12rem; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 60vh; overflow: auto; }
.results button { display: grid; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-bottom: 1px solid var(--line); gap: 1px; }
.results button:hover, .results button.sel { background: var(--accent-soft); }

.view { display: grid; gap: 20px; }
.counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 12px; }
.counter { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-align: left; }
button.counter:hover { border-color: var(--line-strong); }
.counter .n { font-size: 34px; font-weight: 650; font-stretch: 80%; line-height: 1.05; font-variant-numeric: tabular-nums; }
.counter .l { font-size: 13px; font-weight: 600; }
.counter .s { font-size: 12px; color: var(--muted); }
.counter.urgent .n { color: var(--urgent); } .counter.warn .n { color: var(--warn); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; min-width: 0; }
.card-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card-h .s { font-size: 12px; color: var(--muted); }
.card-b { padding: 4px 0; min-width: 0; }
.empty { padding: 18px 16px; color: var(--muted); font-size: 13px; }

.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; }
.item:last-child { border-bottom: 0; }
button.item:hover { background: var(--accent-soft); }
.item .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.item .exp { font-family: var(--f-mono); font-weight: 500; font-size: 13px; white-space: nowrap; }
.item .car { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .side { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 1 / -1; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.urgent { background: var(--urgent-soft); color: var(--urgent); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.claude { background: transparent; color: var(--accent); border-color: var(--accent); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type="search"], .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 16rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: baseline; color: var(--ink); }
.stage b { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--muted); }
.stage[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stage[aria-pressed="true"] b { color: var(--paper); opacity: .75; }
.count { font-size: 12.5px; color: var(--muted); }

.tablebox { overflow: auto; max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
th[aria-sort="ascending"] button::after { content: " ↑"; } th[aria-sort="descending"] button::after { content: " ↓"; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--accent-soft); }
td .car { display: block; color: var(--muted); font-size: 12px; max-width: 46ch; }
td.nw { white-space: nowrap; }
td .car { min-width: 30ch; }
td .chips { max-width: 300px; min-width: 200px; }
td.juz { max-width: 18ch; }
td .chip { max-width: 100%; white-space: normal; }
.more { padding: 12px 16px; display: flex; justify-content: center; }
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 9px; font-size: 12px; }

/* agenda */
.agenda { display: grid; }
.aday { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.aday:last-child { border-bottom: 0; }
.aday .d { display: grid; align-content: start; }
.aday .d b { font-size: 20px; font-weight: 650; font-stretch: 82%; line-height: 1.1; }
.aday .d span { font-size: 12px; color: var(--muted); }
.aday.today .d b { color: var(--accent); }
.aday .list { display: grid; gap: 6px; min-width: 0; }
.aev { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 8px; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; }
.aev:hover { background: var(--accent-soft); }
.aev .k { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; }
.aev .k.plazo { color: var(--warn); } .aev .k.aud { color: var(--accent); } .aev .k.venc { color: var(--urgent); }
.aev .x { display: grid; gap: 1px; min-width: 0; }
.aev .x .car { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tareas */
.msels { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msel { position: relative; }
.msel summary { list-style: none; cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
.msel summary::-webkit-details-marker { display: none; }
.msel summary::after { content: " ▾"; color: var(--muted); }
.msel.on summary { border-color: var(--accent); color: var(--accent); }
.msel-p { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 220px; max-width: min(340px, 90vw); max-height: 320px; overflow: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; }
.msel-p label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.msel-p label:hover { background: var(--accent-soft); }
.msel-p label b { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.more-box { padding: 12px 16px; }
.more-box:empty { display: none; }
.chat .chat-list { max-height: min(62vh, 720px); min-height: 280px; overflow: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.user p { margin: 0; white-space: pre-wrap; }
.msg.assistant { justify-self: start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.assistant .btn { margin-top: 8px; }
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; } .md ul { margin: 0 0 8px; padding-left: 20px; } .md li { margin: 2px 0; } .md h3 { font-size: 14px; margin: 10px 0 4px; }
.md a { color: var(--accent); font-family: var(--f-mono); font-size: 13px; }
.chat-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: end; }
.chat-in textarea { resize: vertical; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.chat-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .chat-wrap { grid-template-columns: minmax(0, 1fr); } }
.chat-hist { max-height: min(70vh, 800px); overflow: auto; }
.ch-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.ch-item.on { background: var(--paper); }
.ch-open { text-align: left; padding: 9px 12px 9px 16px; background: none; border: 0; cursor: pointer; display: grid; gap: 2px; min-width: 0; color: inherit; font: inherit; }
.ch-t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ch-d { font-size: 12px; color: var(--muted); }
.ch-item .x { width: 30px; height: 30px; margin-right: 6px; border-radius: 6px; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.chat-empty { color: var(--muted); } .chat-empty .row { margin-top: 8px; } .chat-empty .btn { text-align: left; white-space: normal; }
.bib { border-bottom: 1px solid var(--line); padding: 8px 16px; }
.bib > summary { cursor: pointer; list-style: none; padding: 4px 0; }
.bib > summary::-webkit-details-marker { display: none; }
.bib > summary::before { content: "▸ "; color: var(--muted); } .bib[open] > summary::before { content: "▾ "; }
.bib .bib { border-bottom: 0; border-left: 2px solid var(--line); margin: 6px 0 6px 4px; padding: 4px 12px; }
.bib-tx { white-space: pre-wrap; font-family: "Times New Roman", serif; font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; max-height: 340px; overflow: auto; margin: 6px 0; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.todo:last-child { border-bottom: 0; }
.todo .main { display: block; min-width: 0; min-height: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; line-height: 1.35; }
.todo .main:hover .acc { color: var(--accent); }
.todo .acc { font-weight: 600; line-height: 1.3; }
.todo .sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: baseline; margin-top: 2px; }
.todo .sub .mono { color: var(--ink); font-size: 13px; }
.todo .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; color: transparent; font-size: 15px; line-height: 1; }
.todo .chk:hover { border-color: var(--accent); color: var(--accent); }
.todo .x { width: 30px; height: 30px; border-radius: 6px; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
.todo .x:hover { background: var(--paper); color: var(--ink); }
.todo.is-done .acc { text-decoration: line-through; color: var(--muted); }
.todo.is-done .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.todo .when { font-weight: 600; color: var(--ink); }
.todo .when.hot { color: var(--urgent); }
.hoy-sum { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.hoy-sum b { color: var(--ink); font-size: 15px; }
.more { display: block; width: 100%; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font-weight: 600; text-align: left; }
.toast button { margin-left: 12px; background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.task input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.task.done .what { text-decoration: line-through; color: var(--muted); }
.task .what { font-weight: 600; }
.task .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.task .mov { font-size: 12px; color: var(--muted); grid-column: 2 / -1; }

/* ficha */
.scrim { position: fixed; inset: 0; background: rgba(10,20,18,.38); z-index: 40; }
.ficha { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(54rem, 100%); background: var(--paper); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: no-preference) { .ficha { animation: slide .22s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
.fh { padding: 18px 22px 14px max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); display: grid; gap: 8px; }
.fh-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.fh .numero { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.fh h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 1.3; text-wrap: balance; }
.fh .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.close { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; width: 32px; height: 32px; display: grid; place-items: center; flex: none; }
.fb { overflow: auto; padding: 18px 22px 32px max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
.rail-st { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.rail-st div { height: 6px; border-radius: 3px; background: var(--line); }
.rail-st div.on { background: var(--accent); }

## Cómo es la cartera
- **SEC c/ empleador s/ cobro de aportes o contribuciones** (CNT, Ley 18.345). Actora: Sindicato de Empleados de Comercio de Capital Federal. La deuda surge de actas de inspección y documental del inicio. Muchos demandados quedan rebeldes o incursos en el art. 71 LO.
- **OSECAC (por un afiliado) c/ ART s/ repetición u otros reclamos** (CNT, Civil o CCF). Se reclaman prestaciones que pagó la obra social por un accidente o enfermedad laboral. Hay mediación previa, contestación con excepciones, audiencia del art. 360, pericias médica y contable, informativa a SRT y otros organismos.
- **Ejecuciones** (SEC ejecución fiscal, ejecución de sentencia o de honorarios): sentencia de trance y remate, liquidación, embargo, giro.
- En casi todos el estudio es **actora**. Si la carátula o los escritos muestran que el estudio representa a la demandada, o a un tercero, los consejos de impulso se invierten: no impulsar, controlar la caducidad a favor y contestar en plazo.

## Escritos de impulso que el estudio usa siempre
